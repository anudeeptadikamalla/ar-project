<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />

    <title>AR Video Gift</title>

    <link rel="stylesheet" href="style.css" />

    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image.prod.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

</head>

<body>

    <!-- Instructions overlay -->
    <div id="instructions" class="overlay">

        <h1>AR Video Gift</h1>

        <p>📸 Point your camera at the target image</p>

        <p id="loading-text">Loading AR...</p>

    </div>


    <!-- Gift Name Input -->

    <div id="name-screen" class="overlay">

        <h1>🎁 Find Your Gift</h1>

        <p>Enter your name to open your AR memory</p>

        <input type="text" id="gift-input" placeholder="Enter your name">

        <button id="gift-button">

            Open Gift ✨

        </button>

    </div>


    <!-- Developer Console -->

    <div id="debug-console"></div>


    <div class="scan-frame"></div>


    <!-- AR Scene -->

    <a-scene id="scene" color-space="sRGB" renderer="colorManagement: true;" vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false">

        <a-assets timeout="10000">

            <video id="video" preload="auto" loop playsinline webkit-playsinline crossorigin="anonymous"></video>

        </a-assets>


        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>


        <a-entity id="target" mindar-image-target="targetIndex: 0">

            <a-video id="video-plane" position="0 0 0" width="0.74" height="1.32"></a-video>

        </a-entity>

    </a-scene>


    <script>

        /* =====================================================
           URL PARAMETERS
        ===================================================== */

        const params = new URLSearchParams(window.location.search);

        const gift = params.get("gift");

        const debugMode = params.get("debug") === "true";


        /* =====================================================
           DEVELOPER LOGGER
        ===================================================== */

        const debugConsole = document.getElementById("debug-console");


        function log(message) {

            console.log(message);

            if (!debugMode) {
                return;
            }

            const time = new Date().toLocaleTimeString();

            const line = document.createElement("div");

            line.textContent = `[${time}] ${message}`;

            debugConsole.appendChild(line);

            debugConsole.scrollTop = debugConsole.scrollHeight;

        }


        /* =====================================================
           GLOBAL ERROR LOGGING
        ===================================================== */

        window.addEventListener("error", (event) => {

            log(`❌ JS ERROR: ${event.message}`);

        });


        window.addEventListener("unhandledrejection", (event) => {

            log(`❌ PROMISE ERROR: ${event.reason}`);

        });


        log("🚀 AR Gift application started");

        log(`Gift parameter: ${gift || "none"}`);

        log(`Debug mode: ${debugMode}`);


        /* =====================================================
           ELEMENTS
        ===================================================== */

        const scene = document.querySelector("#scene");

        const target = document.querySelector("#target");

        const video = document.querySelector("#video");

        const videoPlane = document.querySelector("#video-plane");

        const instructions = document.getElementById("instructions");

        const loadingText = document.getElementById("loading-text");

        const nameScreen = document.getElementById("name-screen");

        const giftInput = document.getElementById("gift-input");

        const giftButton = document.getElementById("gift-button");


        /* =====================================================
           VALID GIFTS
        ===================================================== */

        const validGifts = [
            "rahul",
            "anudeep",
            "deeksha",
            "ramya",
            "sowmya"
        ];


        log(`Valid gifts loaded: ${validGifts.length}`);


        /* =====================================================
           NO GIFT PARAMETER
        ===================================================== */

        if (!gift) {

            log("ℹ️ No gift parameter found");

            instructions.style.display = "none";

            nameScreen.style.display = "flex";


            giftButton.addEventListener("click", () => {

                const enteredName = giftInput.value
                    .trim()
                    .toLowerCase();


                log(`👤 Name entered: ${enteredName}`);


                if (validGifts.includes(enteredName)) {

                    log(`✅ Gift found: ${enteredName}`);

                    window.location.href =
                        `?gift=${enteredName}`;

                }

                else {

                    log(`❌ Gift not found: ${enteredName}`);

                    alert("Gift not found!");

                }

            });


            log("⏸ Waiting for user to enter gift name");

            throw new Error("Waiting for user input");

        }


        /* =====================================================
           HIDE NAME SCREEN
        ===================================================== */

        nameScreen.style.display = "none";


        /* =====================================================
           PERSONALIZED LOADING TEXT
        ===================================================== */

        loadingText.innerText =
            `Loading ${gift}'s Surprise...`;


        log(`🎁 Loading gift: ${gift}`);


        /* =====================================================
           DYNAMIC TARGET LOADING
        ===================================================== */

        const targetPath =
            `./assets/targets/${gift}.mind`;


        log(`🎯 Target file: ${targetPath}`);


        scene.setAttribute(
            "mindar-image",
            `imageTargetSrc: ${targetPath};`
        );


        /* =====================================================
           DYNAMIC VIDEO LOADING
        ===================================================== */

        const videoPath =
            `./assets/videos/${gift}.mp4`;


        log(`🎥 Video file: ${videoPath}`);


        video.src = videoPath;

        video.load();


        log("🎥 Video load requested");


        /* =====================================================
           CONNECT VIDEO TO AR PLANE
        ===================================================== */

        videoPlane.setAttribute("src", "#video");


        log("🖼️ Video connected to AR plane");


        /* =====================================================
           SCENE LOADED
        ===================================================== */

        scene.addEventListener("loaded", () => {

            log("✅ A-Frame scene loaded");

            instructions.style.display = "none";

        });


        /* =====================================================
           TARGET FOUND
        ===================================================== */

        target.addEventListener("targetFound", () => {

            log("🎯 Target FOUND");

            log("▶ Attempting to play video");


            video.play()
                .then(() => {

                    log("▶️ Video is playing");

                })
                .catch(err => {

                    log(`❌ Video play failed: ${err.message}`);

                    console.error(
                        "Video Play Error:",
                        err
                    );

                });

        });


        /* =====================================================
           TARGET LOST
        ===================================================== */

        target.addEventListener("targetLost", () => {

            log("❌ Target LOST");

            video.pause();

            log("⏸️ Video paused");

        });


        /* =====================================================
           VIDEO EVENTS
        ===================================================== */

        video.addEventListener("loadstart", () => {

            log("📥 Video loading started");

        });


        video.addEventListener("loadedmetadata", () => {

            log(
                `ℹ️ Video metadata loaded: ${video.videoWidth}x${video.videoHeight}`
            );

        });


        video.addEventListener("canplay", () => {

            log("✅ Video can play");

        });


        video.addEventListener("play", () => {

            log("▶️ Video PLAY event");

            loadingText.style.display = "none";

        });


        video.addEventListener("pause", () => {

            log("⏸️ Video PAUSE event");

        });


        video.addEventListener("ended", () => {

            log("🏁 Video ended");

        });


        /* =====================================================
           VIDEO ERROR
        ===================================================== */

        video.addEventListener("error", (e) => {

            const mediaError = video.error;

            if (mediaError) {

                log(
                    `❌ Video error: code ${mediaError.code}`
                );

            }
            else {

                log("❌ Unknown video error");

            }

            console.error(
                "Video Error:",
                e
            );

        });


        /* =====================================================
           AR LOADING EVENTS
        ===================================================== */

        scene.addEventListener("arReady", () => {

            log("📷 AR system READY");

        });


        scene.addEventListener("arError", (event) => {

            log("❌ AR system ERROR");

            console.error(
                "AR Error:",
                event
            );

        });


        log("⏳ Waiting for AR initialization...");

    </script>

</body>

</html>
