<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>AR Gift Project</title>
    <link rel="stylesheet" href="style.css?v=1.1" />

    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image.prod.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

</head>

<body>
    <div id="debug-log"
        style="position:fixed; bottom:20px; left:20px; color:lime; background:black; padding:10px; font-family:monospace; z-index:9999; pointer-events:none; border: 1px solid lime; font-size: 12px;">
        Waiting for system...
    </div>

    <a-scene mindar-image="imageTargetSrc: ./assets/targets.mind?v=1.1;" color-space="sRGB"
        renderer="colorManagement: true;" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">

        <a-assets timeout="10000">

            <img id="overlay" src="./assets/overlay.jpg" />

        </a-assets>

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <a-entity mindar-image-target="targetIndex: 0">

            <a-plane src="#overlay" position="0 0 0" width="1" height="0.6">
            </a-plane>

        </a-entity>

    </a-scene>

    <script src="app.js?v=1.1"></script>
    <script>
        const logDiv = document.querySelector('#debug-log');
        const oldLog = console.log;
        console.log = function (message) {
            logDiv.innerHTML = message;
            oldLog.apply(console, arguments);
        };
    </script>

</body>

</html>
