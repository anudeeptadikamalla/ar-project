<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>AR Gift Project</title>
    <link rel="stylesheet" href="style.css?v=2" />

    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image.prod.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

</head>

<body>

    <a-scene mindar-image="imageTargetSrc: ./assets/targets/targets.mind?v=2;" color-space="sRGB"
        renderer="colorManagement: true;" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">

        <a-assets timeout="10000">

            <img id="overlay" src="./assets/overlay.jpg" />

        </a-assets>

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <a-entity mindar-image-target="targetIndex: 0">

            <a-plane src="#overlay" position="0 0 0" width="1" height="0.6">
            </a-plane>

        </a-entity>

    </a-scene>

</body>

</html>
